openapi: 3.0.3
info:
  title: Bank Card Management API
  description: Backend Spring Boot REST API for managing bank cards, user cards, transactions, and user profiles.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: User Cards
    description: USER role — own cards only
  - name: Cards Admin
    description: ADMIN role — all cards
  - name: Users Admin
    description: ADMIN role — user management
  - name: Transactions
    description: Authenticated users

paths:

  # ── User Cards (USER role) ──────────────────────────────────────────────────

  /api/v1/users/me/cards:
    get:
      tags: [ User Cards ]
      summary: Get cards for authenticated user
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated list of cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '401':
          description: Unauthorized

  /api/v1/users/me/cards/search:
    get:
      tags: [ User Cards ]
      summary: Search user's own cards
      description: Searches cards belonging to the authenticated user by PAN.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Search term (e.g. last 4 digits of PAN)
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '401':
          description: Unauthorized

  /api/v1/users/me/cards/{cardId}/transfers:
    post:
      tags: [ User Cards ]
      summary: Transfer balance between own cards
      description: Transfers money from one active card owned by the user to another active card owned by the same user.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: cardId
          in: path
          description: Source card ID
          required: true
          schema:
            type: integer
            format: int64
        - name: targetCardId
          in: query
          description: Destination card ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Amount to transfer
        content:
          application/json:
            schema:
              type: number
              format: double
              minimum: 0.01
              example: 100.00
      responses:
        '200':
          description: Transfer completed successfully
        '400':
          description: Invalid input or insufficient funds
        '401':
          description: Unauthorized

  /api/v1/users/me/cards/{cardId}:
    patch:
      tags: [ User Cards ]
      summary: Request a card block
      description: Flags a card belonging to the authenticated user for blocking.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Block requested successfully
        '400':
          description: Card does not belong to the user
        '401':
          description: Unauthorized

  /api/v1/users/me/cards/{cardId}/balance:
    get:
      tags: [ User Cards ]
      summary: Get card balance
      description: Retrieves the current balance of a specific card owned by the authenticated user.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                type: number
                format: double
        '400':
          description: Card does not belong to the user
        '401':
          description: Unauthorized

  # ── Cards Admin ─────────────────────────────────────────────────────────────

  /api/v1/cards:
    get:
      tags: [ Cards Admin ]
      summary: Find all cards
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated list of all cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '403':
          description: Forbidden
    post:
      tags: [ Cards Admin ]
      summary: Create a new card
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardDTO'
      responses:
        '201':
          description: Card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDTO'
        '403':
          description: Forbidden

  /api/v1/cards/search:
    get:
      tags: [ Cards Admin ]
      summary: Search all cards
      security:
        - bearerAuth: [ ]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '403':
          description: Forbidden

  /api/v1/cards/{id}:
    get:
      tags: [ Cards Admin ]
      summary: Get card by ID
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Card found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDTO'
        '403':
          description: Forbidden
        '404':
          description: Card not found
    put:
      tags: [ Cards Admin ]
      summary: Update a card
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardDTO'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDTO'
        '403':
          description: Forbidden
    delete:
      tags: [ Cards Admin ]
      summary: Delete a card
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Card deleted
        '403':
          description: Forbidden

  /api/v1/cards/{id}/block:
    patch:
      tags: [ Cards Admin ]
      summary: Block a card
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Card blocked
        '403':
          description: Forbidden

  /api/v1/cards/{id}/activate:
    patch:
      tags: [ Cards Admin ]
      summary: Activate a card
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Card activated
        '403':
          description: Forbidden

  # ── Users Admin ─────────────────────────────────────────────────────────────

  /api/v1/users:
    get:
      tags: [ Users Admin ]
      summary: Find all users
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          description: Forbidden
    post:
      tags: [ Users Admin ]
      summary: Create a new user
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '403':
          description: Forbidden

  /api/v1/users/search:
    get:
      tags: [ Users Admin ]
      summary: Search users
      description: Searches users by key fields (name, email, etc.).
      security:
        - bearerAuth: [ ]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          description: Forbidden

  /api/v1/users/role/{role}:
    get:
      tags: [ Users Admin ]
      summary: Find users by role
      security:
        - bearerAuth: [ ]
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [ ADMIN, USER ]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated list of users with the given role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          description: Forbidden

  /api/v1/users/{id}:
    get:
      tags: [ Users Admin ]
      summary: Find user by ID
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '403':
          description: Forbidden
        '404':
          description: User not found
    put:
      tags: [ Users Admin ]
      summary: Update a user
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDTO'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '403':
          description: Forbidden
    delete:
      tags: [ Users Admin ]
      summary: Delete a user
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: User deleted
        '403':
          description: Forbidden

  /api/v1/users/{id}/activate:
    patch:
      tags: [ Users Admin ]
      summary: Activate user
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User activated
        '403':
          description: Forbidden

  /api/v1/users/{id}/deactivate:
    patch:
      tags: [ Users Admin ]
      summary: Deactivate user
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User deactivated
        '403':
          description: Forbidden

  # ── Transactions ────────────────────────────────────────────────────────────

  /api/v1/transactions:
    post:
      tags: [ Transactions ]
      summary: Create a transaction
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionDTO'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDTO'
        '401':
          description: Unauthorized

  /api/v1/transactions/me:
    get:
      tags: [ Transactions ]
      summary: Get transactions for authenticated user
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          description: Unauthorized

  /api/v1/transactions/card/{cardId}:
    get:
      tags: [ Transactions ]
      summary: Get transactions for a card
      security:
        - bearerAuth: [ ]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          description: Unauthorized

  /api/v1/transactions/{id}:
    get:
      tags: [ Transactions ]
      summary: Get transaction by ID
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDTO'
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found
    put:
      tags: [ Transactions ]
      summary: Update a transaction
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionDTO'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDTO'
        '401':
          description: Unauthorized
    delete:
      tags: [ Transactions ]
      summary: Delete a transaction
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Transaction deleted
        '401':
          description: Unauthorized

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20

  schemas:

    UserDTO:
      type: object
      required: [ fullName, password, role ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        fullName:
          type: string
          example: John Doe
        password:
          type: string
          format: password
        role:
          type: string
          enum: [ ADMIN, USER ]

    UserPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    CardDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        maskedPan:
          type: string
          example: "4111 11** **** 1234"
        cardHolderName:
          type: string
          example: John Doe
        expirationDate:
          type: string
          example: "2027-12"
        balance:
          type: number
          format: double
        cardStatus:
          type: string
          enum: [ ACTIVE, BLOCKED, BLOCK_REQUESTED, EXPIRED ]
        userId:
          type: integer
          format: int64

    CreateCardDTO:
      type: object
      required: [ pan, cardHolderName, expirationDate, cardBrand, cardType, balance, cardStatus, userId ]
      properties:
        pan:
          type: string
          example: "4111111111111234"
        cardHolderName:
          type: string
          example: John Doe
        expirationDate:
          type: string
          example: "2027-12"
        cardBrand:
          type: string
          example: VISA
        cardType:
          type: string
          example: DEBIT
        balance:
          type: number
          format: double
          example: 0.00
        cardStatus:
          type: string
          enum: [ ACTIVE, BLOCKED, BLOCK_REQUESTED, EXPIRED ]
        userId:
          type: integer
          format: int64

    CardPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CardDTO'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    TransactionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        type:
          type: string
          example: TRANSFER
        amount:
          type: number
          format: double
        date:
          type: string
          example: "2026-05-28T10:00:00"
        cardId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64

    TransactionPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDTO'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer