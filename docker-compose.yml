services:
  db:
    image: postgres:17
    container_name: bank-rest-db
    environment:
      POSTGRES_DB: bank-rest-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank-rest-service"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
